name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test on ${{ matrix.platform }}
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            xcodegen_platform: macOS
            destination: platform=macOS
          - platform: iOS
            xcodegen_platform: iOS
            destination: platform=iOS Simulator,name=iPhone 16
          - platform: tvOS
            xcodegen_platform: tvOS
            destination: platform=tvOS Simulator,name=Apple TV
          - platform: watchOS
            xcodegen_platform: watchOS
            destination: platform=watchOS Simulator,name=Apple Watch Series 10 (45mm)
          - platform: visionOS
            xcodegen_platform: visionOS
            destination: platform=visionOS Simulator,name=Apple Vision Pro

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          PLATFORM: ${{ matrix.xcodegen_platform }}
        run: |
          cat > project.yml <<'EOF'
          name: Essentials

          options:
            deploymentTarget:
              macOS: "12.0"
              iOS: "15.0"
              tvOS: "15.0"
              watchOS: "10.0"
              visionOS: "1.0"

          targets:
           targets:
            Essentials:
              type: framework
              platform: ${PLATFORM}
              sources:
                - Sources
              settings:
                base:
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          
            EssentialsTests:
              type: bundle.unit-test
              platform: ${PLATFORM}
              sources:
                - Tests
              dependencies:
                - target: Essentials
              settings:
                base:
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO

          schemes:
            Essentials:
              build:
                targets:
                  Essentials: all
                  EssentialsTests: [test]
              test:
                targets:
                  - EssentialsTests
          EOF

          sed -i '' "s/\${PLATFORM}/${PLATFORM}/g" project.yml
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Essentials.xcodeproj \
            -scheme Essentials \
            -destination '${{ matrix.destination }}' \
            build

      - name: Test
        run: |
          xcodebuild \
            -project Essentials.xcodeproj \
            -scheme Essentials \
            -destination '${{ matrix.destination }}' \
            test
